name: Actualizar GeoJSON

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geojson-update
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Sincronizar con rama main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Generar GeoJSON
        run: |
          python generar_geojson.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add estaciones_meteorologicas.geojson

          git commit -m "Actualizar GeoJSON meteorológico" || exit 0

          git push origin HEAD:main
